name: Update Daily Quote

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Fetch Quote and Update README
        run: |
          cat << 'EOF' > update-quote.js
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          (async () => {
              let quote = "Code is like humor. When you have to explain it, it’s bad.";
              let success = false;
              const maxAttempts = 3;

              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                  let browser;
                  try {
                      console.log(`Attempt ${attempt} of ${maxAttempts}...`);
                      browser = await puppeteer.launch({ 
                          args: ['--no-sandbox', '--disable-setuid-sandbox'] 
                      });
                      const page = await browser.newPage();
                      
                      await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');
                      await page.goto('https://programming-quotesapi.vercel.app/api/random', { waitUntil: 'domcontentloaded' });
                      
                      await page.waitForFunction(() => {
                          try {
                              const data = JSON.parse(document.body.innerText);
                              return data && data.quote;
                          } catch (e) {
                              return false;
                          }
                      }, { timeout: 10000 });
                      
                      const content = await page.evaluate(() => document.body.innerText);
                      const data = JSON.parse(content);
                      
                      if (data && data.quote) {
                          quote = data.quote;
                          success = true;
                          console.log("Success!");
                      }
                  } catch (err) {
                      console.error(`Attempt ${attempt} failed:`, err.message);
                  } finally {
                      if (browser) await browser.close();
                  }

                  if (success) break;
              }

              const encodedQuote = encodeURIComponent(quote);
              const readme = fs.readFileSync('README.md', 'utf-8');
              
              const updatedReadme = readme.replace(
                  /(readme-typing-svg\.demolab\.com.*?[?&]lines=)[^&\)\]"]+/g,
                  `$1${encodedQuote}`
              );

              fs.writeFileSync('README.md', updatedReadme);
          })();
          EOF

          node update-quote.js
          rm update-quote.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "vonubat-special-repo-ci-cd[bot]"
          git config --global user.email "4084666+vonubat-special-repo-ci-cd[bot]@users.noreply.github.com"

          git add README.md

          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily quote"
          git push
