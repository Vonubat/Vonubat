name: Update Daily Quote

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch Quote and Update README
        shell: python
        run: |
          import urllib.request
          import urllib.error
          import urllib.parse
          import json
          import re

          try:
              url = "https://programming-quotesapi.vercel.app/api/random"
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'})
              with urllib.request.urlopen(req) as response:
                  raw_data = response.read().decode('utf-8')
                  print("--- DEBUG SUCCESS HTTP INFO ---")
                  print(f"Status: {response.getcode()}")
                  print(f"Raw Response: {raw_data}")
                  print("-------------------------------")
                  
                  data = json.loads(raw_data)
                  quote = data.get('quote', 'Talk is cheap. Show me the code.')
          except urllib.error.HTTPError as e:
              print("--- DEBUG HTTP ERROR ---")
              print(f"Code: {e.code}")
              print(f"Reason: {e.reason}")
              print(f"Body: {e.read().decode('utf-8', errors='ignore')}")
              print("------------------------")
              quote = "Code is like humor. When you have to explain it, it’s bad."
          except Exception as e:
              print("--- DEBUG GENERAL ERROR ---")
              print(f"Type: {type(e).__name__}")
              print(f"Message: {str(e)}")
              print("---------------------------")
              quote = "Code is like humor. When you have to explain it, it’s bad."

          encoded_quote = urllib.parse.quote(quote)

          with open('README.md', 'r', encoding='utf-8') as file:
              readme = file.read()

          updated_readme = re.sub(
              r'(readme-typing-svg\.demolab\.com.*?[?&]lines=)[^&\)\]"]+',
              r'\g<1>' + encoded_quote,
              readme
          )

          with open('README.md', 'w', encoding='utf-8') as file:
              file.write(updated_readme)

      - name: Commit and Push changes
        run: |
          git config --global user.name "vonubat-special-repo-ci-cd[bot]"
          git config --global user.email "4084666+vonubat-special-repo-ci-cd[bot]@users.noreply.github.com"

          git add README.md

          git diff --quiet && git diff --staged --quiet || git commit -m "Update daily quote"
          git push
