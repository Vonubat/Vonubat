name: Update Daily Quote

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Puppeteer and Stealth Plugin
        run: npm install puppeteer@21.11.0 puppeteer-extra@3.3.6 puppeteer-extra-plugin-stealth@2.11.2

      - name: Fetch Quote and Update README
        run: node .github/scripts/update-quote.js

      - name: Commit and Push changes
        run: bash .github/scripts/commit-and-push.sh
